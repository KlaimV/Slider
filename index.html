<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container">
    <div class="slider-wrapper" id="slider">
      
      <div class="slide active">
        <img src="images/352-800x400.jpg" alt="Slide 1">
        <div class="slide-info">
          <h3>Дорога зі світла</h3>
          <p>Щось все ж вкаже тобі дорогу</p>
        </div>
      </div>

      <div class="slide">
        <img src="images/200-800x400.jpg" alt="Slide 2">
        <div class="slide-info">
          <h3>Корова?</h3>
          <p>Мууууу</p>
        </div>
      </div>

      <div class="slide">
        <img src="images/106-800x400.jpg" alt="Slide 3">
        <div class="slide-info">
          <h3>Велич природи</h3>
          <p>Просто така перспектива</p>
        </div>
      </div>

      <div class="slide">
        <img src="images/539-800x400.jpg" alt="Slide 4">
        <div class="slide-info">
          <h3>Магія світла</h3>
          <p>Вікна запотіли</p>
        </div>
      </div>

      <div class="slide">
        <img src="images/590-800x400.jpg" alt="Slide 5">
        <div class="slide-info">
          <h3>Сучасний мінімалізм</h3>
          <p>Передбачає багато людей</p>
        </div>
      </div>

      <div class="slide">
        <img src="images/939-800x400.jpg" alt="Slide 6">
        <div class="slide-info">
          <h3>Загублений світ</h3>
          <p>Не змогли побудувати адекватний будинок</p>
        </div>
      </div>

    </div>

    <div class="controls">
      <button id="prevBtn">←</button>
      <button id="nextBtn">→</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
